name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Package
      uses: BigWigsMods/packager@v2
      with:
        args: -zd

    - name: Archive
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: Clicked
        path: .release/
        include-hidden-files: true
